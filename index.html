<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pepe Political Party - $PPP</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto&display=swap" rel="stylesheet">

  <style>
    :root{ --navy:#0c223b; --navy-2:#102a48; --red:#d1292f; --white:#ffffff; }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{ font-family:'Roboto',sans-serif; background-color:var(--navy); color:var(--white); }

    /* Sidebar */
    #sidebar{
      background-color:var(--navy);
      width:250px; height:100vh; overflow-y:auto;
      position:fixed; top:0; left:0; border-right:3px solid var(--red); padding-top:20px;
    }
    #sidebar h2{ color:var(--white); text-align:center; font:700 1.5em 'Playfair Display',serif; margin-bottom:10px; }
    #sidebar a{ display:block; color:var(--white); padding:12px 20px; text-decoration:none; border-bottom:1px solid rgba(255,255,255,.12); }
    #sidebar a:hover{ background-color:var(--navy-2); }

    /* Main content */
    .content{ margin-left:250px; padding:20px; min-height:100vh; }
    header.page-title{
      background-color:var(--navy); color:var(--white);
      text-align:center; padding:30px 20px;
      font-family:'Playfair Display',serif; font-size:2.5em; letter-spacing:2px; font-weight:700;
      border-bottom:4px solid var(--red); margin-bottom:20px;
    }
    .banner{
      width:100%; display:block; margin:0 0 30px 0; border-bottom:4px solid var(--red);
      background:#081a2e; border-radius:4px;
    }
    .gallery{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:20px; }
    .gallery img{ width:100%; display:block; border:3px solid var(--white); border-radius:10px; background:#081a2e; }

    /* Mobile */
    .mobile-nav-toggle{ display:none; width:100%; background:var(--red); color:var(--white); border:0; font-size:1.5em; padding:10px 20px; text-align:left; }
    .mobile-menu{ display:none; background:var(--navy); border-top:3px solid var(--red); }
    .mobile-menu a{ display:block; color:var(--white); padding:12px 20px; text-decoration:none; border-bottom:1px solid rgba(255,255,255,.12); }
    .mobile-menu a:hover{ background:var(--navy-2); }

    @media (max-width:768px){
      #sidebar{ display:none; }
      .mobile-nav-toggle{ display:block; }
      .content{ margin-left:0; padding:15px; }
      .banner{ margin-top:10px; }
    }
  </style>

  <script>
    // Toggle mobile menu
    function toggleMobileMenu(){
      const m=document.getElementById('mobileMenu');
      m.style.display = (m.style.display==='block') ? 'none' : 'block';
    }
    // Small placeholder if an image fails (so the page never looks empty)
    function fallback(img,label){
      img.onerror=null;
      const svg = `
        <svg xmlns='http://www.w3.org/2000/svg' width='1200' height='675'>
          <rect width='100%' height='100%' fill='#102a48'/>
          <text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle'
                font-family='Arial, sans-serif' font-size='36' fill='#ffffff'>
            Missing: ${label}
          </text>
        </svg>`;
      img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
      img.style.outline='2px dashed #ff9aa2';
    }
    // Add a version to bust cache
    const V='v=20250814';
  </script>
</head>
<body>

  <!-- Desktop Sidebar -->
  <nav id="sidebar" aria-label="Site">
    <h2>Pepe Political Party</h2>
    <a href="index.html">$PPP</a>
    <a href="president.html">President Pepe</a>
    <a href="origins.html">Origins</a>
    <a href="feed.html">💬 Social Network</a>
    <a href="shop.html">🛒 Shop</a>
    <a href="buy.html">Buy Now</a>
  </nav>

  <!-- Mobile Dropdown -->
  <button class="mobile-nav-toggle" onclick="toggleMobileMenu()">☰ Menu</button>
  <nav id="mobileMenu" class="mobile-menu" aria-label="Mobile Site">
    <a href="index.html">$PPP</a>
    <a href="president.html">President Pepe</a>
    <a href="origins.html">Origins</a>
    <a href="feed.html">💬 Social Network</a>
    <a href="shop.html">🛒 Shop</a>
    <a href="buy.html">Buy Now</a>
  </nav>

  <!-- Main -->
  <main class="content">
    <header class="page-title">Pepe Political Party - $PPP</header>

    <!-- Banner (cache-busted + fallback) -->
    <img class="banner" alt="PPP Banner"
         src="images/banner.jpg?"+V
         onerror="fallback(this,'images/banner.jpg')">

    <!-- Gallery 1–10 (cache-busted + fallback) -->
    <section class="gallery" aria-label="Image gallery">
      <img src="images/image-1.jpg?"+V alt="Gallery Image 1" onerror="fallback(this,'images/image-1.jpg')">
      <img src="images/image-2.jpg?"+V alt="Gallery Image 2" onerror="fallback(this,'images/image-2.jpg')">
      <img src="images/image-3.jpg?"+V alt="Gallery Image 3" onerror="fallback(this,'images/image-3.jpg')">
      <img src="images/image-4.jpg?"+V alt="Gallery Image 4" onerror="fallback(this,'images/image-4.jpg')">
      <img src="images/image-5.jpg?"+V alt="Gallery Image 5" onerror="fallback(this,'images/image-5.jpg')">
      <img src="images/image-6.jpg?"+V alt="Gallery Image 6" onerror="fallback(this,'images/image-6.jpg')">
      <img src="images/image-7.jpg?"+V alt="Gallery Image 7" onerror="fallback(this,'images/image-7.jpg')">
      <img src="images/image-8.jpg?"+V alt="Gallery Image 8" onerror="fallback(this,'images/image-8.jpg')">
      <img src="images/image-9.jpg?"+V alt="Gallery Image 9" onerror="fallback(this,'images/image-9.jpg')">
      <img src="images/image-10.jpg?"+V alt="Gallery Image 10" onerror="fallback(this,'images/image-10.jpg')">
    </section>
  </main>

</body>
</html>
