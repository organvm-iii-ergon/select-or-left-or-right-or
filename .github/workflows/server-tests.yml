name: Server regressions

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run complete dependency-isolated repository test suite
        run: |
          set -euo pipefail
          git log -1 --format='checkout=%H tree=%T'
          node --check server.js
          env -u JWT_SECRET node --test __tests__/*.test.js
          JWT_SECRET=synthetic-initial-test-value node --test __tests__/*.test.js
          git diff --exit-code
      - name: Verify complete fixture teardown for absent and present initial values
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          probe = """
          const assert = require('node:assert/strict');
          const had = Object.prototype.hasOwnProperty.call(process.env, 'JWT_SECRET');
          const original = process.env.JWT_SECRET;
          process.once('beforeExit', () => {
            assert.equal(Object.prototype.hasOwnProperty.call(process.env, 'JWT_SECRET'), had);
            assert.ok(process.env.JWT_SECRET === original, 'suite must restore initial environment value');
            console.log('PASS: complete fixture teardown preserves initial environment');
          });
          require('./__tests__/server.test.js');
          """
          for initial in (None, 'synthetic-initial-test-value'):
              env = dict(os.environ)
              env.pop('JWT_SECRET', None)
              if initial is not None:
                  env['JWT_SECRET'] = initial
              subprocess.run(['node', '-e', probe], env=env, check=True, timeout=60)
          PY
      - name: Prove JWT regressions reject the original insecure implementation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          baseline = '11b3d69f36123fc4d142bcb9a04f59c1fbc38625'
          with tempfile.TemporaryDirectory() as directory:
              for folder in ('lib', '__tests__'):
                  Path(directory, folder).mkdir()
              for name in ('server.js', 'lib/utils.js', '__tests__/server.test.js'):
                  Path(directory, name).write_bytes(subprocess.check_output(['git', 'show', f'HEAD:{name}']))
              Path(directory, 'server.js').write_bytes(subprocess.check_output(['git', 'show', f'{baseline}:server.js']))
              env = dict(os.environ)
              env.pop('JWT_SECRET', None)
              result = subprocess.run(
                  ['node', '--test', '--test-name-pattern=fails closed when JWT_SECRET', '__tests__/server.test.js'],
                  cwd=directory, env=env, capture_output=True, text=True, timeout=60,
              )
              print(result.stdout)
              print(result.stderr)
              failures = re.search(r'^# fail (\d+)$', result.stdout, re.MULTILINE)
              if result.returncode == 0 or failures is None or int(failures.group(1)) != 3:
                  raise SystemExit('Negative baseline must fail exactly the three missing/empty/whitespace secret cases')
              if result.stdout.count('Missing expected exception') < 3:
                  raise SystemExit('Negative control failed for a reason other than the missing secret guard')
              print('PASS: all three JWT regressions reject the original insecure server')
          PY
      - name: Verify checkout remains unchanged
        run: git diff --exit-code
